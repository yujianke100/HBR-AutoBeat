help: "'o' 鍵啟用，'p' 鍵取消啟用並暫停，直接點擊上方按鈕也能切換激活狀態。\n\n啟用後聚焦遊戲內，按鈕變綠，打歌開始。\n\n移動遊戲窗口後請先點擊'重新識別遊戲視窗'。\n\n使用前請先初始化設置，關閉按壓線，再將按鍵大小設置為80%。若發生長按過早或過晚結束的情況，\n\n請調整'Press Time'。\n\n若显示「Low Performance」，代表装置效能较低，游玩节奏游戏时可能会反应不及。"
