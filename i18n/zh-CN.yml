help: "'o' 激活，'p' 取消激活并暂停，直接点击上方按钮也能切换激活状态。\n\n激活后聚焦游戏内，按钮变绿，打歌开始。\n\n游戏窗口移动后先点击'重新识别游戏窗口'。\n\n使用前请先初始化设置，关闭按压线,再将按键大小设置为80%。\n\n若出现长按过早/过晚结束，请调整'Press Time'。\n\n若显示'Low Performance'，说明设备性能较差，打歌时会出现来不及反应的情况。"
