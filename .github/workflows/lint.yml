name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      - name: Run black (check)
        run: black --check .
      - name: Run isort (check)
        run: isort --check-only .
      - name: Run flake8
        run: flake8 .
      - name: Run mypy
        run: mypy . --ignore-missing-imports
name: Lint

on:
  push:
    branches: ["main", "master", "*/feature/*", "*/feature"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy
      - name: Run black
        run: black --check .
      - name: Run isort
        run: isort --check-only .
      - name: Run flake8
        run: flake8 .
      - name: Run mypy
        run: mypy . || true
